name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleRelease
      - name: Publish release (used by in-app updater)
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk WifiRadar.apk
          gh release create "build-${{ github.run_number }}" WifiRadar.apk \
            --title "WiFi Radar 1.0.${{ github.run_number }}" \
            --notes "${COMMIT_MSG:-New version}" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: WifiRadar
          path: WifiRadar.apk
